[project]
name = "trip-ledger-backend"
version = "0.1.0"
description = "FastAPI backend for Trip Ledger: in-memory ledger API, seeded for demos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.53",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=8.3",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
